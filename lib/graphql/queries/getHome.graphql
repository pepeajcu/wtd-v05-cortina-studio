query GetHome {
  homeSingletons(first: 1) {
    nodes {
      id

      # Hero
      heroEyebrow
      heroTitle
      heroSubtitle
      heroImage
      heroImageCaption
      heroCtaLabel
      heroCtaMessage

      # Problems
      problemsEyebrow
      problemsTitle
      problemsSubtitle
      problemsCards        # repeater → JSON string

      # Reels
      reelsEyebrow
      reelsTitle
      reelsSubtitle
      reelsSelected        # repeater → JSON string
      reelsCtaText
      reelsCtaButton
      reelsWhatsappMessage

      # Process
      processEyebrow
      processTitlePrefixM
      processTitlePrefixF
      processTitleSuffix
      processRotatingWords # repeater → JSON string
      processSubtitle
      processCtaLabel
      processSteps         # repeater → JSON string
    }
  }
}
