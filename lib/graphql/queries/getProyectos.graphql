query GetProyectos {
  # Solo proyectos PUBLICADOS, del mas reciente al mas antiguo.
  # La home consume esta misma lista: no hay seleccion manual en el singleton.
  proyectos(
    first: 50
    where: { status: PUBLISH, orderby: { field: DATE, order: DESC } }
  ) {
    nodes {
      id
      databaseId
      title
      slug
      video
      videoPoster
      videoAlt
      platform
      originalUrl
      spaceType
      clientProblem
      solution
      benefit
      solutionSummary
    }
  }
}
