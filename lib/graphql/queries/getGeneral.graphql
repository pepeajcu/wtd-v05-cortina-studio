query GetGeneral {
  general {
    # Contacto / WhatsApp
    whatsappNumber
    whatsappDefaultMessage
    contactPhone
    contactEmail
    contactAddress

    # Social
    socialInstagram
    socialTiktok
    socialFacebook

    # Marca
    brandName
    brandLogo

    # Footer CTA
    footerCtaTitle
    footerCtaDescription
    footerCtaButton
    footerCopyright

    # Navegacion (repeater Options Page → JSON string,
    # shape `{item-N: {nav_items_label, nav_items_url, nav_items_order}}`)
    navItems
  }
}
